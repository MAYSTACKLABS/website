  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <script>
    // Apply the saved or system theme before first paint, so the page never flashes the wrong colours.
    (() => {
      try {
        const requested = new URLSearchParams(location.search).get('theme');
        const saved = localStorage.getItem('theme');
        const dark = requested ? requested === 'dark' : saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#05070d' : '#f5f6f8';
      } catch {}
    })();
  </script>

    html{background:#f2f6ff}body{margin:0;background:transparent}
    html.dark{background:#05070d}
  </style>
